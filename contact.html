<!DOCTYPE html>
<html lang="en">
  
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
  </head>

  <body>
    <header>
      <h1>Contact</h1>
    </header>

    <!-- Links to website navigation -->
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="skills.html">Skills</a></li>
        <li><a href="resume.html">Resume</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>

    <!-- Main content -->
    <main>
      <h2>Let's Get in Touch!</h2>
      <p>Feel free to reach out to me using this form.</p>
      <!-- Contact form -->
      <div id="form">
        <form class="form-grid">

          <!-- Info for user to fill out -->
          <fieldset>
            <legend>User Information</legend>
            <label for="fName">First Name:</label>
            <input type="text" name="fName" id="fName"/>
            <label for="lName">Last Name:</label>
            <input type="text" name="lName" id="lName"/>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email"/>
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone"/>
          </fieldset>

          <!-- Dropdown selection for user interest -->
          <fieldset>
            <legend>User Interest</legend>
            <label for="subject">Inquiry Type:</label>
            <select id="subject" name="subject" required>
              <option value="" disabled selected>Select an option</option>
              <option value="job">Job Opportunity</option>
              <option value="project">Collaborative Project</option>
              <option value="other">Other</option>
            </select>
          </fieldset>

          <!-- textarea for additional comments -->
          <fieldset>
            <legend>User Comment</legend>
            <label for="comment">Share Any Additional Information:</label>
            <textarea id="comment" name="userComment" rows="5" cols="50"></textarea>
          </fieldset>
          <input type="submit" id="submit" value="Submit" class="btn">
        </form>
      </div>
    </main>

    <!-- Footer content -->
    <footer>
      <p>Student Name: Sophia Gerke</p>
    </footer>
  </body>
  
</html>
